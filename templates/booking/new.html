
{% extends 'base.html' %}

{% block title %}Book Service{% endblock %}

{% block content %}
    <h2>Book {{ service['title'] }}</h2>
    <form method="post">
        <label for="travel_date">Travel Date</label>
        <input type="text" id="travel_date" name="travel_date" required>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
        <script>
            flatpickr("#travel_date", {
                dateFormat: "Y-m-d", // force YYYY-MM-DD
                defaultDate: "today"
            });
        </script>
        <label for="num_travelers">Number of Travelers</label>
        <input type="number" id="num_travelers" name="num_travelers" min="1" max="{{ service['max_travelers'] }}" required>
        <button type="submit">Proceed to Enter Details</button>
    </form>
{% endblock %}
